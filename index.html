<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060f1e" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/fahrtenrekorder.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/fahrtenrekorder.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>WetterApp</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #1a2d42;
        min-height: 100vh;
        background: linear-gradient(160deg, #a8c8e8 0%, #b8d8f0 25%, #cce4f5 55%, #9ec4e0 100%);
      }

      /* Wolken */
      @keyframes cloudDrift {
        from { transform: translateX(-800px); }
        to   { transform: translateX(110vw); }
      }
      .cloud {
        position: fixed;
        border-radius: 50%;
        filter: blur(45px);
        pointer-events: none;
        z-index: 0;
        background: rgba(255, 255, 255, 0.55);
      }
      .cloud-1 { width: 700px; height: 200px; top: 8%;  animation: cloudDrift 80s  linear infinite; }
      .cloud-2 { width: 500px; height: 160px; top: 35%; animation: cloudDrift 110s linear infinite; animation-delay: -35s; }
      .cloud-3 { width: 380px; height: 130px; top: 62%; animation: cloudDrift 95s  linear infinite; animation-delay: -60s; }

      /* Lade-Punkte */
      @keyframes pulse {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40%            { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
